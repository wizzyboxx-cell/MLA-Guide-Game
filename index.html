<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Citation Island: an island adventure that teaches MLA 9 citation for music sources.">
<title>Citation Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}

/* Layout: one-column adventure app. An island map is the level select; zones unlock along a trail from shore to summit.
   Deliberately single-theme: deep tropical sea at night with sand, jungle and treasure gold. */
:root{
  color-scheme: dark;
  --bg:#0d2a3a; --bg2:#123749; --card:#16445a; --line:#2e6a85;
  --ink:#f6fbff; --muted:#a9cad8; --gold:#ffd166; --good:#46d69c; --bad:#ff6f82;
  --c-author:#ff9466; --c-title:#6ec8ff; --c-container:#c99bff; --c-pub:#ffd166; --c-date:#7be3a8; --c-link:#7fe0e8; --c-plain:#d8d7f5;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#1d5a73 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;margin-bottom:6px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.brand svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.pill.star{color:var(--gold)}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.ghost:hover{border-color:var(--muted)}

/* Map */
.hero{padding-block:10px 4px}
.hero h1{font-size:clamp(30px,6vw,44px)}
.hero p{color:var(--muted);margin:.4em 0 0;max-width:56ch}
.mapbox{margin:16px auto 0;max-width:100%;border-radius:24px;overflow:hidden;border:3px solid #fff3d6;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mapbox svg{display:block;width:100%;height:auto}
.zone{cursor:pointer}.zone.locked{cursor:not-allowed}
.zone:not(.locked):hover .zi,.zone:focus-visible .zi{transform:scale(1.12)}
.zi{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.zone:focus{outline:none}.zone:focus-visible rect{stroke:#fff;stroke-width:5}
.fog circle{fill:#eef4f7;opacity:.93}
.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.mapfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.logh{font-size:22px;margin-top:22px}
.staff{margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:10px 6px 4px;overflow:hidden}
.staff svg{display:block;width:100%;height:auto}
.note{cursor:pointer}
.note.locked{cursor:not-allowed}
.note:focus-visible circle.head{stroke:var(--gold);stroke-width:5}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.lvl{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.lvl:hover:not(:disabled){border-color:var(--lc,var(--gold));transform:translateY(-2px)}
.lvl{transition:transform .15s,border-color .15s}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl .num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--lc);color:#15173a}
.lvl b{display:block;font-family:var(--display);font-weight:600;font-size:17px}
.lvl small{color:var(--muted);font-size:14px}
.lvl .st{color:var(--gold);letter-spacing:2px;font-size:14px}

/* Stage (level play) */
.prog{height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lc,var(--gold)),var(--gold));border-radius:99px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lc,var(--gold))}
.card h2{font-size:clamp(23px,4.6vw,30px);margin:.25em 0 .5em}
.card p{margin:.5em 0;max-width:62ch}
.muted{color:var(--muted)}
.big-ico{font-size:0;margin-bottom:6px}

/* Citation anatomy */
.cite{font-size:17px;line-height:2.15;background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;overflow-wrap:anywhere}
.seg{border-radius:7px;padding:3px 6px;margin-right:2px;color:#15173a;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.k-author{background:var(--c-author)} .k-title{background:var(--c-title)} .k-container{background:var(--c-container)}
.k-pub{background:var(--c-pub)} .k-date{background:var(--c-date)} .k-link{background:var(--c-link)} .k-plain{background:var(--c-plain)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.example{font-size:15px;color:var(--muted);margin-top:6px}
.example .lab{font-weight:700;color:var(--ink)}
.tip{display:flex;gap:10px;align-items:flex-start;background:rgba(255,201,74,.1);border:1px solid rgba(255,201,74,.35);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:16px}
.tip b{color:var(--gold)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.split h3{text-wrap:balance}
.split>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.split h3{font-size:18px;margin-bottom:4px}
@media (max-width:520px){.split{grid-template-columns:1fr}}

/* Challenges */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16.5px;overflow-wrap:anywhere;transition:border-color .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--lc,var(--gold))}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.right{border-color:var(--good);background:rgba(70,214,156,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,111,130,.14)}
.opt:disabled{cursor:default}
.slots{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px;margin-top:14px}
.slots:empty::before{content:"Tap the pieces below in the right order";color:var(--muted);font-size:15px;align-self:center;padding:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tile{border:0;border-radius:10px;padding:8px 11px;font-weight:700;font-size:15.5px;color:#15173a;box-shadow:0 3px 0 rgba(0,0,0,.35);overflow-wrap:anywhere;max-width:100%;text-align:left}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tile.used{display:none}
.spotline{line-height:2.5;font-size:17px;background:var(--bg);border-radius:14px;padding:12px;margin-top:14px;overflow-wrap:anywhere}
.spot{border:2px solid var(--line);background:var(--card);border-radius:9px;padding:3px 7px;margin:2px;font-size:16.5px;text-align:left}
.spot:hover:not(:disabled){border-color:var(--gold)}
.spot.right{border-color:var(--good);background:rgba(70,214,156,.18)}
.spot.wrong{border-color:var(--bad);background:rgba(255,111,130,.18)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--gold);color:#1a1530;border:0;border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 4px 0 #b8861a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8861a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.fb{margin-top:16px;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s ease}
.fb.ok{background:rgba(70,214,156,.14);border:1px solid var(--good)}
.fb.no{background:rgba(255,111,130,.12);border:1px solid var(--bad)}
.fb h3{font-size:19px}
.fb p{margin:.2em 0 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Results */
.result{text-align:center}
.stars{display:flex;justify-content:center;gap:10px;margin:14px 0}
.stars svg{width:60px;height:60px}
.stars .on{animation:starIn .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result .actions{justify-content:center}
.badge{margin:6px auto 0;width:170px;display:block}

/* Cheat sheet */
.page{background:#fbfaf6;color:#1d1d2b;border-radius:6px;padding:18px 20px;font-family:"Times New Roman",Georgia,serif;font-size:14.5px;line-height:2;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.page .ph{text-align:center}
.page .pe{padding-left:2.2em;text-indent:-2.2em}
.rules{margin:10px 0 0;padding-left:1.2em;display:grid;gap:6px}
.doclink{color:var(--gold);font-weight:700;text-underline-offset:3px}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;min-width:0;transition:transform .15s,border-color .15s}
.gcard:hover{border-color:var(--lc);transform:translateY(-3px)}
.gcard svg{background:color-mix(in srgb,var(--lc) 25%,transparent);border-radius:50%;margin-bottom:4px}
.gband{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lc)}
.gcard b{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1}
.gprog{color:var(--muted);font-size:14px;font-weight:700}
.gdesc{font-size:15.5px}
.gstat{margin-top:auto;padding-top:8px;color:var(--gold);font-weight:700;font-size:15px}
.steps{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.steps li{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.steps .seg{display:inline-block;margin:0 8px 4px 0;font-size:14.5px}
.browser{background:#fbfaf6;border-radius:12px;overflow:hidden;margin:12px 0;color:#1d2b36;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bbar{background:#dfe5ea;padding:8px 10px;display:flex;align-items:center;gap:6px;font-size:13px;overflow-wrap:anywhere}
.bbar i{width:10px;height:10px;border-radius:50%;background:#b8c1c9;flex:none}
.bbar .seg{margin-left:6px;font-weight:600}
.bpage{padding:12px 16px 16px;display:grid;gap:8px}
.bsite .seg{font-size:13px}
.btitle .seg{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.5}
.bmeta{display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.bline{height:8px;border-radius:4px;background:#e2e6ea}.bline.short{width:65%}
.bfoot{font-size:13px;color:#5a6670;border-top:1px solid #e2e6ea;padding-top:8px}
.sheet{display:grid;gap:12px;margin-top:12px}
.sheet .item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .cite{margin:8px 0 4px;font-size:15.5px;line-height:2}
.sheet table{border-collapse:collapse;width:100%;font-size:15.5px}
.sheet td,.sheet th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.sheet th{color:var(--muted);font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" id="home" aria-label="Back to the island map">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="9" cy="21" r="5.5" fill="#ffc94a"/><rect x="13" y="3" width="3" height="18" rx="1.5" fill="#ffc94a"/><path d="M16 3c4 1 7 4 6 9-1-3-3-4-6-4z" fill="#ffc94a"/></svg>
      Citation Island
    </button>
    <span class="pill star" title="Stars earned"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg><span id="starCount">0</span>/<span id="starMax">24</span></span>
    <button class="ghost" id="lvlBtn" title="Change your level">Choose level</button>
    <button class="ghost" id="sheetBtn">Cheat sheet</button>
    <button class="ghost" id="soundBtn" aria-pressed="true" title="Sound on or off">Sound on</button>
  </div>
  <main id="app"></main>
</div>
<canvas id="confetti"></canvas>

<script>
/* ---------- Content (from the MLA Citation Guide for Musicians) ---------- */
const KEYS={author:"Author",title:"Title (small thing)",container:"Big thing (book, album, website)",pub:"Place, publisher or label",date:"Date",link:"Link or access date",plain:"Other"};
const C=(parts)=>parts.map(([k,t])=>`<span class="seg k-${k}">${t}</span>`).join(" ");
const legend=(ks)=>`<div class="legend">${ks.map(k=>`<span><i class="k-${k}"></i>${KEYS[k]}</span>`).join("")}</div>`;

const BASE=[
 {key:"shore",name:"Soundcheck",sub:"Why and where we cite",color:"#ffc94a",steps:[
  {type:"learn",title:"Every source gets cited twice",html:`
   <p>Whenever you use someone else's words or ideas, you give them credit in two places.</p>
   <div class="split">
     <div><h3 style="color:var(--c-container)">1. Works Cited</h3><p class="muted" style="margin:0">A list at the <b>end</b> of your work with the full details of every source.</p></div>
     <div><h3 style="color:var(--c-title)">2. In-text citation</h3><p class="muted" style="margin:0">A short tag in <b>your sentence</b>, right where you use the source, like <b style="color:var(--ink)">(Nettl 57)</b>.</p></div>
   </div>
   <div class="tip"><b>MLA 9</b><span>This quest follows the 9th edition of the MLA Handbook, the version your school uses.</span></div>`},
  {type:"learn",title:"How the Works Cited page looks",html:`
   <div class="page" aria-hidden="true">
     <div class="ph">Works Cited</div>
     <div class="pe">Langhamer, Claire. “Love and Courtship in Mid-Twentieth-Century England.” <i>Historical Journal</i>, vol. 50, no. 1, 2007, pp. 173-96.</div>
     <div class="pe">Malm, William P. “Japanese Music.” <i>Encyclopedia Britannica</i>, 2015, www.britannica.com/art/Japanese-music.</div>
     <div class="pe">Paul, Roger. <i>IB Music Revision Guide</i>. 3rd ed., Anthem Press, 2018.</div>
   </div>
   <ul class="rules">
     <li><b>New page</b> at the end, titled <b>Works Cited</b>, centred, not bold.</li>
     <li><b>Alphabetical</b> by the first word of each entry, usually the author's last name. Ignore A, An and The.</li>
     <li><b>Double-spaced</b>, with a <b>hanging indent</b>: the first line starts at the margin, the next lines move in half an inch.</li>
   </ul>`},
  {type:"mcq",q:"Where do the full details of a source go?",options:["In brackets inside my sentence","In the Works Cited list at the end","In the title of my essay"],answer:1,explain:"The Works Cited list at the end holds the full details. The short tag in brackets goes in your sentence."},
  {type:"mcq",q:"What is a hanging indent?",options:["Every line of the entry moves in half an inch","The first line starts at the margin and the lines after it move in","The entry is centred on the page"],answer:1,explain:"The first line hangs out at the margin, so the first word of every entry is easy to spot when you scan the alphabetical list."},
  {type:"build",q:"Sort this Works Cited list into the correct order.",prompt:"Tap the entries from first to last.",tiles:[["plain","Langhamer, Claire."],["plain","Malm, William P."],["plain","Nettl, Bruno, and Timothy Rommen."],["plain","Paul, Roger."]],explain:"Alphabetical by last name: Langhamer, Malm, Nettl, Paul."}
 ]},
 {key:"books",name:"Books",sub:"Print sources and authors",color:"#ff9466",steps:[
  {type:"learn",title:"A book, piece by piece",html:`
   <p>Every citation is a set of pieces in a fixed order. Learn the colours and you can build any of them.</p>
   <div class="cite">${C([["author","Paul, Roger."],["title","<i>IB Music Revision Guide</i>."],["plain","3rd ed.,"],["pub","Anthem Press,"],["date","2018."]])}</div>
   ${legend(["author","title","plain","pub","date"])}
   <p class="example"><span class="lab">Pattern:</span> Last Name, First Name. <i>Title of Book</i>. Edition, Publisher, Year.</p>
   <div class="tip"><b>MLA 9</b><span>No city of publication. Just the publisher's name, a comma and the year.</span></div>`},
  {type:"learn",title:"One, two or more authors",html:`
   <div class="sheet" style="margin:10px 0"><div class="item" style="background:var(--bg)"><table>
     <tr><th>Authors</th><th>How the entry starts</th></tr>
     <tr><td>One</td><td><b>Paul, Roger.</b></td></tr>
     <tr><td>Two</td><td><b>Nettl, Bruno, and Timothy Rommen.</b></td></tr>
     <tr><td>Three or more</td><td><b>Burkholder, J. Peter, et al.</b></td></tr>
   </table></div></div>
   <p>Only the <b>first</b> author is flipped to Last Name, First Name. With three or more, name the first author and add <b>et al.</b> (Latin for "and others").</p>
   <div class="cite" style="font-size:15.5px">${C([["author","Burkholder, J. Peter, et al."],["title","<i>A History of Western Music</i>."],["plain","10th ed.,"],["pub","W. W. Norton,"],["date","2019."]])}</div>`},
  {type:"build",q:"Build the MLA 9 citation for Roger Paul's book.",tiles:[["author","Paul, Roger."],["title","<i>IB Music Revision Guide</i>."],["plain","3rd ed.,"],["pub","Anthem Press,"],["date","2018."]],explain:"Author, title, edition, publisher, year."},
  {type:"mcq",q:"Bruno Nettl and Timothy Rommen wrote a book together. How does the entry start?",options:["Nettl, Bruno, and Rommen, Timothy.","Bruno Nettl and Timothy Rommen.","Nettl, Bruno, and Timothy Rommen."],answer:2,explain:"Only the first author is flipped. The second author keeps normal order."},
  {type:"spot",q:"This book citation follows an older MLA rule. Tap the piece MLA 9 removes.",parts:[["Nettl, Bruno, and Timothy Rommen."],["<i>Excursions in World Music</i>."],["7th ed.,"],["New York:",true],["Routledge,"],["2017."]],explain:"MLA 9 leaves out the city of publication. Write the publisher and year only."}
 ]},
 {key:"web",name:"Websites",sub:"Step by step",color:"#9be564",steps:[
  {type:"learn",title:"Citing a website, step by step",html:`
   <p>Work through the page from top to bottom and collect each piece in this order.</p>
   <ol class="steps">
    <li><span class="seg k-author">1 Author</span> A person: Last Name, First Name. An organisation: its name. No author, or the author is the website itself? Skip this step.</li>
    <li><span class="seg k-title">2 Page title</span> The title of the page, in “quotation marks”.</li>
    <li><span class="seg k-container">3 Website name</span> The name of the whole site, in <i>italics</i>.</li>
    <li><span class="seg k-pub">4 Publisher</span> Only if it is different from the website name.</li>
    <li><span class="seg k-date">5 Date</span> When the page was published or updated: Day Month Year, like 3 Feb. 2025.</li>
    <li><span class="seg k-link">6 URL</span> Copy it from the address bar and leave out https://.</li>
    <li><span class="seg k-link">7 Access date</span> %%ACCESS%%</li>
   </ol>`},
  {type:"learn",title:"Where to find each piece",html:`
   <p>Most web pages show the pieces in the same places. Match the colours.</p>
   <div class="browser" aria-hidden="true">
     <div class="bbar"><i></i><i></i><i></i><span class="seg k-link">https://www.example.com/practise-scales</span></div>
     <div class="bpage">
       <div class="bsite"><span class="seg k-container">Example Music Blog</span></div>
       <div class="btitle"><span class="seg k-title">Five Ways to Practise Scales</span></div>
       <div class="bmeta"><span class="seg k-author">By Hannah Lee</span> <span class="seg k-date">3 February 2025</span></div>
       <div class="bline"></div><div class="bline short"></div><div class="bline"></div>
       <div class="bfoot">© <span class="seg k-pub">Example Media Group</span></div>
     </div>
   </div>
   <p>Put together:</p>
   <div class="cite">${C([["author","Lee, Hannah."],["title","“Five Ways to Practise Scales.”"],["container","<i>Example Music Blog</i>,"],["pub","Example Media Group,"],["date","3 Feb. 2025,"],["link","www.example.com/practise-scales."]])}</div>
   <p class="muted" style="font-size:15px">A made-up page to show the shape. Real pages may hide the date or author at the bottom of the page.</p>`},
  {type:"build",q:"Build the citation for Hannah Lee's web page.",tiles:[["author","Lee, Hannah."],["title","“Five Ways to Practise Scales.”"],["container","<i>Example Music Blog</i>,"],["pub","Example Media Group,"],["date","3 Feb. 2025,"],["link","www.example.com/practise-scales."]],explain:"Author, “Page,” <i>Website</i>, publisher, date, URL."},
  {type:"mcq",q:"Which URL is written the MLA 9 way?",options:["https://www.example.com/practise-scales","www.example.com/practise-scales","example.com"],answer:1,explain:"Copy the full address but leave out https://. Keep the rest so a reader can find the exact page."},
  {type:"spot",q:"Tap the piece that breaks an MLA 9 rule.",parts:[["Lee, Hannah."],["“Five Ways to Practise Scales.”"],["<i>Example Music Blog</i>,"],["February 3, 2025,",true],["www.example.com/practise-scales."]],explain:"MLA dates go Day Month Year with long months shortened: 3 Feb. 2025."},
  {type:"mcq",q:"A page on the Example Music Society website has no named author. The site is run by the Example Music Society. How does the entry start?",options:["Example Music Society.","Anonymous.","With the title of the page"],answer:2,explain:"When the organisation and the website have the same name, skip the author and start with the page title."},
  {type:"mcq",g:[3],q:"You cite a web page in your Extended Essay. What should you do about the access date?",options:["Leave it out, because MLA 9 says it is optional","Add it, because IB work asks for the date you accessed online sources","Only add it if the page is more than a year old"],answer:1,explain:"MLA 9 makes access dates optional, but IB guidance asks you to show when you accessed online sources. Add “Accessed” and the date at the end."}
 ]},
 {key:"light",name:"Online reading",sub:"Encyclopedias and databases",color:"#6ec8ff",steps:[
  {type:"learn",title:"Articles live inside something bigger",html:`
   <p>The article title goes in “quotation marks”. The bigger thing that holds it (the <b>container</b>) goes in <i>italics</i>.</p>
   <div class="cite">${C([["author","Malm, William P."],["title","“Japanese Music.”"],["container","<i>Encyclopedia Britannica</i>,"],["date","2015,"],["link","www.britannica.com/art/Japanese-music."]])}</div>
   ${legend(["author","title","container","date","link"])}
   <div class="tip"><b>MLA 9</b><span>If the publisher has the same name as the website, like Britannica, leave the publisher out.</span></div>
   <p class="example" style="margin-top:12px"><span class="lab">Database article (JSTOR, ProQuest):</span> add volume, issue and pages, then the database in italics and the DOI as a full link.</p>
   <div class="cite" style="font-size:15.5px">${C([["author","Langhamer, Claire."],["title","“Love and Courtship in Mid-Twentieth-Century England.”"],["container","<i>Historical Journal</i>, vol. 50, no. 1,"],["date","2007,"],["plain","pp. 173-96."],["container","<i>ProQuest</i>,"],["link","https://doi.org/10.1017/S0018246X06005966."]])}</div>`},
  {type:"spot",q:"Tap the piece that breaks an MLA 9 rule.",parts:[["Langhamer, Claire."],["“Love and Courtship in Mid-Twentieth-Century England.”"],["<i>Historical Journal</i>, vol. 50, no. 1, 2007, pp. 173-96."],["<i>ProQuest</i>,"],["doi:10.1017/S0018246X06005966.",true]],explain:"MLA 9 writes a DOI as a full link: https://doi.org/10.1017/S0018246X06005966."},
  {type:"spot",q:"Spot the mistake in this database citation.",parts:[["Langhamer, Claire."],["“Love and Courtship in Mid-Twentieth-Century England.”"],["“Historical Journal,”",true],["vol. 50, no. 1, 2007, pp. 173-96."]],explain:"The journal is the container, so it goes in italics: <i>Historical Journal</i>. Quotation marks are for the article inside it."},
  {type:"mcq",q:"How should 24 April 2020 appear in a Works Cited entry?",options:["April 24, 2020","24 Apr. 2020","24/04/2020"],answer:1,explain:"Day, short month, year: 24 Apr. 2020."}
 ]},
 {key:"caves",name:"Songs and albums",sub:"Spotify, Apple Music, CDs",color:"#c99bff",steps:[
  {type:"learn",title:"Citing what you listen to",html:`
   <p>The <b>musician or band</b> takes the author spot. A solo artist is flipped like any author. A band name stays as it is.</p>
   <div class="cite">${C([["author","Morris, Rae."],["title","“Skin.”"],["container","<i>Unguarded</i>,"],["pub","Atlantic Records,"],["date","2015."],["container","<i>Spotify</i>,"],["link","open.spotify.com/track/0OPES3Tw5r86O6fudK8gxi."]])}</div>
   ${legend(["author","title","container","pub","date","link"])}
   <div class="split">
     <div><h3 style="color:var(--c-container)">A whole album</h3><p class="muted" style="margin:0;font-size:15px">Artist. <i>Album Title</i>. Label, Year.<br>Morris, Rae. <i>Unguarded</i>. Atlantic Records, 2015.</p></div>
     <div><h3 style="color:var(--c-title)">Liner notes</h3><p class="muted" style="margin:0;font-size:15px">Writer of the notes. Liner notes. <i>Album Title</i>, by Artist, Label, Year.</p></div>
   </div>
   <div class="tip"><b>Song or album?</b><span>Song in “quotation marks”, album in <i>italics</i>. Small thing inside the big thing.</span></div>`},
  {type:"build",q:"Build the Spotify citation for “Skin” by Rae Morris.",tiles:[["author","Morris, Rae."],["title","“Skin.”"],["container","<i>Unguarded</i>,"],["pub","Atlantic Records,"],["date","2015."],["container","<i>Spotify</i>,"],["link","open.spotify.com/track/0OPES3Tw5r86O6fudK8gxi."]],explain:"Artist, “Song,” <i>Album</i>, label, year, then the platform and link."},
  {type:"mcq",q:"Which artist name is written correctly at the start of an entry?",options:["Rae Morris.","Morris, Rae.","Morris Rae."],answer:1,explain:"A solo artist is a person, so the name is flipped: Last Name, First Name."},
  {type:"mcq",q:"You cite a song by the band Arctic Monkeys. How does the entry start?",options:["Monkeys, Arctic.","Arctic Monkeys.","“Arctic Monkeys.”"],answer:1,explain:"Band and group names are never flipped."}
 ]},
 {key:"falls",name:"Videos and live music",sub:"YouTube and concerts",color:"#7fe0e8",steps:[
  {type:"learn",title:"YouTube: who made it?",html:`
   <div class="split">
     <div><h3 style="color:var(--c-author)">Creator is not the uploader</h3><p class="muted" style="margin:0;font-size:15px">McGonigal, Jane. “Gaming and Productivity.” <i>YouTube</i>, uploaded by Big Think, 3 July 2012, www.youtube.com/watch?v=mkdzy9bWW3E.</p></div>
     <div><h3 style="color:var(--c-title)">Creator is the uploader</h3><p class="muted" style="margin:0;font-size:15px">The channel is the author, so no “uploaded by”.<br>Crazy Russian Hacker. “8 Hot Dog Gadgets put to the Test.” <i>YouTube</i>, 6 June 2016, www.youtube.com/watch?v=WBlpjSEtELs.</p></div>
   </div>`},
  {type:"learn",title:"A live concert",html:`
   <p>For a performance you saw in person, give who performed, the title, the venue, the city and the date.</p>
   <div class="cite">${C([["author","ISHCMC Music Department."],["title","<i>Secondary Winter Recital 2026</i>."],["pub","Secondary Theatre, ISHCMC, Ho Chi Minh City,"],["date","16 Dec. 2026."]])}</div>
   ${legend(["author","title","pub","date"])}
   <div class="tip"><b>Tip</b><span>If you focus on one performer or composer, start with their name instead, and describe their role later if needed.</span></div>`},
  {type:"build",q:"Build the citation for Jane McGonigal's talk, uploaded by Big Think.",tiles:[["author","McGonigal, Jane."],["title","“Gaming and Productivity.”"],["container","<i>YouTube</i>,"],["pub","uploaded by Big Think,"],["date","3 July 2012,"],["link","www.youtube.com/watch?v=mkdzy9bWW3E."]],explain:"Author, “Video,” <i>YouTube</i>, uploaded by, date, link."},
  {type:"mcq",q:"A YouTuber made and uploaded their own video. How does the citation start?",options:["With the channel name as the author","With the word YouTube","With “uploaded by”"],answer:0,explain:"When the creator is the uploader, the channel goes first as the author, and you leave out “uploaded by”."},
  {type:"mcq",q:"Which detail must a live concert citation include that a Spotify citation does not?",options:["The record label","The venue and city","An access date"],answer:1,explain:"A live performance happened in a place, so give the venue, the city and the date."}
 ]},
 {key:"temple",name:"Scores",sub:"Sheet music",color:"#ffb3d1",steps:[
  {type:"learn",title:"Citing a musical score",html:`
   <p>The <b>composer</b> takes the author spot. The score title goes in <i>italics</i>, like a book. If the edition has an editor, name them after the title.</p>
   <div class="cite">${C([["author","Bach, Johann Sebastian."],["title","<i>Six Suites for Violoncello Solo</i>."],["plain","Edited by Bettina Schwemer and Douglas Woodfull-Harris,"],["pub","Bärenreiter,"],["date","2000."]])}</div>
   ${legend(["author","title","plain","pub","date"])}
   <p class="example"><span class="lab">Pattern:</span> Composer Last Name, First Name. <i>Title of Score</i>. Edited by Name, Publisher, Year.</p>
   <div class="tip"><b>Online score?</b><span>Add the website in italics and the URL at the end, like any online source.</span></div>`},
  {type:"build",q:"Build the citation for this edition of Bach's cello suites.",tiles:[["author","Bach, Johann Sebastian."],["title","<i>Six Suites for Violoncello Solo</i>."],["plain","Edited by Bettina Schwemer and Douglas Woodfull-Harris,"],["pub","Bärenreiter,"],["date","2000."]],explain:"Composer, <i>Title</i>, editor, publisher, year."},
  {type:"mcq",q:"Who goes in the author spot for a score?",options:["The editor","The composer","The publisher"],answer:1,explain:"The composer wrote the music, so they come first. The editor comes after the title."}
 ]},
 {key:"jungle",name:"In-text citations",sub:"Quotes, paraphrases, timestamps",color:"#7be3a8",steps:[
  {type:"learn",title:"The short tag in your sentence",html:`
   <p>Put the first word of the Works Cited entry (usually the author's last name) and the <b>page number</b> in brackets. No comma between them.</p>
   <div class="sheet" style="margin:10px 0"><div class="item" style="background:var(--bg)"><table><tr><th>Source</th><th>In brackets</th></tr>
     <tr><td>One author</td><td><b>(Nettl 57)</b></td></tr>
     <tr><td>Two authors</td><td><b>(Nettl and Rommen 57)</b></td></tr>
     <tr><td>Three or more</td><td><b>(Burkholder et al. 214)</b></td></tr>
     <tr><td>No author</td><td><b>(“How Gamelan Tuning Works”)</b></td></tr>
     <tr><td>No page numbers</td><td><b>(Malm)</b></td></tr>
     <tr><td>Song or video</td><td><b>(McGonigal 00:02:15-00:02:45)</b></td></tr>
   </table></div></div>
   <div class="tip"><b>No author?</b><span>Use a short version of the title, in the same style as the Works Cited entry.</span></div>`},
  {type:"learn",title:"Four ways to use a source",html:`
   <div class="split">
     <div><h3 style="color:var(--c-title)">Direct quote</h3><p class="muted" style="margin:0;font-size:15px">Word for word, in “double quotation marks”, then cite.</p></div>
     <div><h3 style="color:var(--c-date)">Paraphrase</h3><p class="muted" style="margin:0;font-size:15px">In your own words. No quotation marks, but you <b>still cite</b>.</p></div>
     <div><h3 style="color:var(--c-author)">Indirect quote</h3><p class="muted" style="margin:0;font-size:15px">Quoting someone your source quoted. Single marks inside double marks, and <b>qtd. in</b>: (qtd. in Nettl 78-79).</p></div>
     <div><h3 style="color:var(--c-container)">Long quote</h3><p class="muted" style="margin:0;font-size:15px">More than four lines? Start a new line, indent it half an inch, drop the quotation marks, and put the citation after the final full stop.</p></div>
   </div>`},
  {type:"mcq",q:"You quote page 214 of a book by Burkholder, Grout and Palisca. Which citation is right?",options:["(Burkholder, Grout, Palisca 214)","(Burkholder et al. 214)","(Burkholder and others, 214)"],answer:1,explain:"Three or more authors: first last name plus “et al.”"},
  {type:"spot",q:"Tap the mistake in this sentence.",parts:[["According to ethnomusicologist Bruno Nettl,"],["“music often has functional purposes”"],["(Nettl, 57).",true]],explain:"No comma between name and page: (Nettl 57)."},
  {type:"mcq",q:"You quote words sung between 1:12 and 1:30 of a song by Rae Morris. Which citation is right?",options:["(Morris 00:01:12-00:01:30)","(Morris, page 1)","(Morris)"],answer:0,explain:"Songs and videos have no pages, so give the time range in hours, minutes and seconds."},
  {type:"mcq",g:[2,3],q:"A musician is quoted inside Nettl's book on pages 78-79. You use that quote. Which is correct?",options:["“music is ““often used as expression””” (Nettl 78-79)","“music is ‘often used as expression’” (qtd. in Nettl 78-79)","music is often used as expression (Nettl)"],answer:1,explain:"Single marks for the quote inside the quote, and “qtd. in” the source you actually read."},
  {type:"mcq",q:"You summarise Nettl's idea from page 62 in your own words. Do you need a citation?",options:["Yes: (Nettl 62)","No, because there are no quotation marks","Only if it is longer than one sentence"],answer:0,explain:"A paraphrase still uses someone else's idea, so it always gets a citation."}
 ]},
 {key:"ridge",name:"IB academic integrity",sub:"AI tools, figures, consistency",color:"#ffa94d",steps:[
  {type:"learn",title:"Academic integrity in the IB",html:`
   <p>In the IB Diploma, you cite <b>everything you did not create yourself</b>: words, ideas, images, recordings, scores, data and output from AI tools.</p>
   <ul class="rules">
     <li>Use <b>one</b> citation style, such as MLA 9, all the way through a piece of work.</li>
     <li>Every in-text citation must match an entry in your Works Cited list, and every entry must be used in the text.</li>
     <li>For online sources, add the date you accessed them, even though MLA 9 makes it optional.</li>
     <li>This applies to your Extended Essay, internal assessments, Theory of Knowledge (TOK) essay and coursework.</li>
   </ul>
   <div class="tip"><b>Check</b><span>Follow your school's academic integrity policy and ask your supervisor when you are unsure.</span></div>`},
  {type:"learn",title:"AI tools and figures",html:`
   <p class="example"><span class="lab">AI tool pattern (MLA guidance):</span> “Your prompt” prompt. <i>Name of AI Tool</i>, version, Company, Date, URL.</p>
   <div class="cite">${C([["title","“Explain what a ground bass is in Baroque music”"],["plain","prompt."],["container","<i>ChatGPT</i>,"],["plain","GPT-4o version,"],["pub","OpenAI,"],["date","12 Oct. 2026,"],["link","chatgpt.com."]])}</div>
   <p class="muted" style="font-size:15px">A made-up example. Only use AI tools where your teacher allows them, and say how you used them.</p>
   <p style="margin-top:14px"><b>Figures:</b> label each image, chart or score excerpt in your essay <b>Fig. 1</b>, <b>Fig. 2</b> and so on. Give it a caption that names the source, and list the source in your Works Cited.</p>
   <div class="cite" style="font-size:15.5px">Fig. 1. Opening of the Prelude from Suite No. 1, from Bach, <i>Six Suites for Violoncello Solo</i>.</div>`},
  {type:"mcq",q:"You paste four bars of a printed score into your Extended Essay. What do you do?",options:["Nothing, because music is not words","Label it as a figure, add a caption with the source, and cite it","Only cite it if you copy more than one page"],answer:1,explain:"A score excerpt is someone else's work, so it gets a figure label, a caption and a Works Cited entry."},
  {type:"mcq",q:"In an MLA citation for an AI tool, what takes the title spot?",options:["The name of the company","A description of your prompt, in quotation marks","Your own name"],answer:1,explain:"The prompt you typed (or a description of it) goes first, in quotation marks, followed by the word prompt."},
  {type:"mcq",q:"Your IA uses MLA for books and a different style for websites. Is that acceptable?",options:["Yes, any mix is fine","No, use one style consistently all the way through","Only if the essay is longer than 2,000 words"],answer:1,explain:"The IB expects one citation style used consistently across the whole piece of work."}
 ]},
 {key:"volcano",name:"Encore",sub:"Final mixed challenge",color:"#ff6f82",steps:[
  {type:"learn",title:"Encore round",html:`<p>Quick questions from every zone. Get them all right for three stars, then open the treasure chest.</p><div class="tip"><b>Stuck?</b><span>The <b>Cheat sheet</b> button at the top has every pattern. Real musicians check their music too.</span></div>`},
  {type:"mcq",q:"Which goes in italics?",options:["A song title","An album title","A YouTube video title"],answer:1,explain:"Containers (albums, books, journals, websites, scores) are in italics. Songs, articles and videos go in quotation marks."},
  {type:"build",q:"Put these Works Cited entries in order.",prompt:"Tap from first to last.",tiles:[["plain","Malm, William P."],["plain","McGonigal, Jane."],["plain","Morris, Rae."],["plain","Nettl, Bruno."]],explain:"Ma comes before Mc, and Mc before Mo. Then Nettl."},
  {type:"spot",q:"Find the wrong piece in this book citation.",parts:[["Paul, Roger."],["“IB Music Revision Guide.”",true],["3rd ed.,"],["Anthem Press,"],["2018."]],explain:"A book is a container, so its title goes in italics: <i>IB Music Revision Guide</i>."},
  {type:"mcq",g:[2,3],q:"Which part of an MLA 9 book citation is no longer needed?",options:["The publisher","The city of publication","The year"],answer:1,explain:"MLA 9 dropped the city. Publisher and year stay."},
  {type:"mcq",q:"You cite a web page. What goes in italics?",options:["The title of the page","The name of the website","The author"],answer:1,explain:"The website is the container, so it goes in italics. The page title goes in quotation marks."},
  {type:"mcq",g:[1,2],q:"When should you add an access date to an online source?",options:["Always, on every source","When the page has no date of its own","Never"],answer:1,explain:"Access dates are optional in MLA 9. They help most when the page gives no publication date."},
  {type:"mcq",q:"You paraphrase page 12 of a book by two authors, Smith and Lee. Which is right?",options:["(Smith and Lee 12)","(Smith et al. 12)","(Smith, Lee, p.12)"],answer:0,explain:"Two authors: both last names joined with “and”, then the page."}
 ]}
];

/* ---------- State ---------- */
const store={get(){try{return JSON.parse(localStorage.getItem("cq-mla9")||"null")}catch(e){return null}},set(v){try{localStorage.setItem("cq-mla9",JSON.stringify(v))}catch(e){}}};
let S=store.get()||{};S.prog=S.prog||{};S.sound=S.sound!==false;S.stars=[];
let play=null; // {li, si, mistakes}
const app=document.getElementById("app");
const save=()=>store.set(S);
const total=()=>S.stars.reduce((a,b)=>a+b,0);
const unlocked=i=>i===0||S.stars[i-1]>0;

/* ---------- Levels by grade: each grade gets its own set of zones and its own saved progress ---------- */
const GRADES={
 1:{name:"Explorer",band:"Grades 6 to 8",prog:"MYP 1 to 3",color:"#9be564",
    desc:"Learn the basics: books, websites, songs, videos and quoting in your writing.",
    zones:["shore","books","web","caves","falls","jungle","volcano"],
    access:"Add “Accessed” and the date you read the page only if the page shows no date of its own."},
 2:{name:"Navigator",band:"Grades 9 to 10",prog:"MYP 4 to 5",color:"#6ec8ff",
    desc:"Everything in Explorer, plus research databases, musical scores and quotes inside quotes.",
    zones:["shore","books","web","light","caves","falls","temple","jungle","volcano"],
    access:"Optional in MLA 9. Add “Accessed” and the date you read the page when the page shows no date of its own."},
 3:{name:"Captain",band:"Grades 11 to 12",prog:"IB Diploma",color:"#ffa94d",
    desc:"The full island, plus IB academic integrity: AI tools, figures in your Extended Essay and access dates.",
    zones:["shore","books","web","light","caves","falls","temple","jungle","ridge","volcano"],
    access:"MLA 9 makes it optional, but for IB work <b>always</b> add “Accessed” and the date you read the page."}
};
const ZMETA={shore:["Soundcheck Shore","boat"],books:["Bookwreck Cove","books"],web:["Signal Tower","tower"],light:["Lighthouse Point","lighthouse"],
 caves:["Echo Caves","cave"],falls:["Waterfall Stage","falls"],temple:["Score Temple","temple"],jungle:["Quotation Jungle","jungle"],ridge:["Research Ridge","ridge"],volcano:["Volcano Summit","volcano"]};
let LEVELS=[],ZONES=[];
function applyGrade(g){
  const G=GRADES[g];
  LEVELS=G.zones.map(k=>{const b=BASE.find(x=>x.key===k);
    return {...b,steps:b.steps.filter(st=>!st.g||st.g.includes(g)).map(st=>st.html?{...st,html:st.html.replace("%%ACCESS%%",G.access)}:st)}});
  const n=LEVELS.length;
  ZONES=LEVELS.map((L,i)=>{const [name,icon]=ZMETA[L.key];
    const y=Math.round(640-i*(540/(n-1)));const x=(i===0||i===n-1)?300:(i%2?160:440)+(i%4===1?-10:i%4===3?10:0);
    return {name,icon,x,y}});
  S.grade=g;S.prog[g]=(S.prog[g]||[]).slice(0,n);while(S.prog[g].length<n)S.prog[g].push(0);
  S.stars=S.prog[g];save();
}
function renderLevelSelect(){
  play=null;
  const emblem={1:`<circle r="30" fill="#fffaf0" stroke="#16324a" stroke-width="4"/><path d="M0-22l7 22-7 22-7-22z" fill="#ff6f82" stroke="#16324a" stroke-width="2"/><path d="M0 22l7-22h-14z" fill="#16324a"/><circle r="4" fill="#ffd166"/>`,
   2:`<circle r="26" fill="none" stroke="#b5652f" stroke-width="7"/><circle r="9" fill="#b5652f" stroke="#16324a" stroke-width="2"/>${[0,45,90,135].map(a=>`<rect x="-3" y="-38" width="6" height="76" rx="3" fill="#b5652f" stroke="#16324a" stroke-width="1.5" transform="rotate(${a})"/>`).join("")}<circle r="26" fill="none" stroke="#16324a" stroke-width="2"/>`,
   3:`<path d="M-34 6c10-22 58-22 68 0z" fill="#16324a"/><path d="M-26 4c6-30 46-30 52 0z" fill="#22303f" stroke="#ffd166" stroke-width="3"/><circle cy="-10" r="7" fill="#ffd166"/><path d="M-40 8h80" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>`};
  app.innerHTML=`<section class="hero"><h1>Choose your level</h1><p>Pick your grade to set the route across Citation Island. Each level saves its own progress, so you can switch any time.</p></section>
  <div class="grades">${[1,2,3].map(g=>{const G=GRADES[g],pr=S.prog[g],st=pr?pr.reduce((a,b)=>a+b,0):0;return `
    <button class="gcard" data-g="${g}" style="--lc:${G.color}">
      <svg viewBox="-44 -44 88 88" width="78" height="78" aria-hidden="true">${emblem[g]}</svg>
      <span class="gband">${G.band}</span>
      <b>${G.name}</b>
      <span class="gprog">${G.prog} · ${G.zones.length} zones</span>
      <span class="gdesc">${G.desc}</span>
      <span class="gstat">${st?`★ ${st} of ${G.zones.length*3} stars · Continue`:"Start here"}</span>
    </button>`}).join("")}</div>`;
  app.querySelectorAll(".gcard").forEach(b=>b.onclick=()=>{applyGrade(+b.dataset.g);renderMap()});
  document.getElementById("lvlBtn").textContent=S.grade?GRADES[S.grade].band:"Choose level";
  window.scrollTo({top:0});
}


/* ---------- Sound: each right answer plays the next note of a scale ---------- */
let ac=null;
function tone(freq,t0=0,dur=.18,type="triangle",vol=.16){
  if(!S.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;

let streak=0;
function startLevel(i){play={li:i,si:0,mistakes:0};streak=0;renderStep()}
function frame(inner){
  const L=LEVELS[play.li],n=L.steps.length;

    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">

function renderStep(){
  const s=LEVELS[play.li].steps[play.si];
  if(s.type==="learn"){
    const c=h(`<div class="card"><span class="eyebrow">Learn</span><h2>${s.title}</h2>${s.html}<div class="actions"><button class="btn">Got it</button></div></div>`);
    frame(c);c.querySelector(".btn").onclick=next;return;
  }
  if(s.type==="mcq"){
    const c=h(`<div class="card"><span class="eyebrow">Challenge</span><h2>${s.q}</h2><div class="opts"></div></div>`);
    const box=c.querySelector(".opts");
    shuffle(s.options.map((o,i)=>[o,i])).forEach(([o,i])=>{
      const b=h(`<button class="opt">${o}</button>`);
      b.onclick=()=>{box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        const ok=i===s.answer;b.classList.add(ok?"right":"wrong");
        if(!ok)[...box.children].find(x=>x.dataset.i==s.answer).classList.add("right");
        feedback(c,ok,s.explain)};
      b.dataset.i=i;box.appendChild(b);
    });
    frame(c);return;
  }
  if(s.type==="build"){
    const c=h(`<div class="card"><span class="eyebrow">Build it</span><h2>${s.q}</h2><p class="muted">${s.prompt||"Tap the pieces in the right order. Tap a placed piece to send it back."}</p>

      <div class="actions"><button class="btn" disabled>Check</button></div></div>`);
    const slots=c.querySelector(".slots"),pool=c.querySelector(".pool"),chk=c.querySelector(".btn");
    const order=s.tiles.map((t,i)=>i);let placed=[];
    let sh=shuffle(order);if(sh.every((v,i)=>v===i))sh=sh.reverse();
    const draw=()=>{
      slots.innerHTML="";placed.forEach(i=>{const [k,t]=s.tiles[i];const b=h(`<button class="tile k-${k}">${t}</button>`);b.onclick=()=>{placed=placed.filter(x=>x!==i);draw()};slots.appendChild(b)});
      pool.innerHTML="";sh.forEach(i=>{const [k,t]=s.tiles[i];const b=h(`<button class="tile k-${k}${placed.includes(i)?" used":""}">${t}</button>`);b.onclick=()=>{if(!placed.includes(i)){placed.push(i);tone(SCALE[placed.length%8]*.5,0,.08,"sine",.06);draw()}};pool.appendChild(b)});
      chk.disabled=placed.length!==s.tiles.length;
    };
    draw();
    chk.onclick=()=>{
      const ok=placed.every((v,i)=>s.tiles[v][1]===s.tiles[i][1]);

    };

  }
  if(s.type==="spot"){
    const c=h(`<div class="card"><span class="eyebrow">Spot the error</span><h2>${s.q}</h2><div class="spotline"></div></div>`);
    const line=c.querySelector(".spotline");
    s.parts.forEach(([t,bad])=>{const b=h(`<button class="spot">${t}</button>`);b.dataset.bad=bad?1:"";

  }

/* ---------- Confetti ---------- */
const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let bits=[],raf=0;
function confetti(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffc94a","#ff9466","#6ec8ff","#c99bff","#7be3a8","#ff6f82"],glyph=["♪","♫","♩"];
  for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[i%6],g:i%4===0?glyph[i%3]:null,a:Math.random()*6});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.04;b.a+=.1;cx.fillStyle=b.c;
    if(b.g){cx.font="22px serif";cx.fillText(b.g,b.x,b.y)}else{cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillRect(-4,-2,8+b.r,5);cx.restore()}});
  bits=bits.filter(b=>b.y<cv.height+30);
  raf=bits.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
